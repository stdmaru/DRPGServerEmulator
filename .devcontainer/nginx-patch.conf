server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    autoindex off;
    server_tokens off;

    location = /DR_Configuration.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location ~* ^/Patch_[0-9]+\.zip$ {
        default_type application/zip;
    }

    location / {
        return 404;
    }
}
